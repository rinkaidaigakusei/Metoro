<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>太鼓メトロノーム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1c1a22;
    --bg-deep: #131118;
    --cream: #f3ecdd;
    --cream-dim: #cfc6b3;
    --don: #e0453f;
    --don-dim: #6e2624;
    --ka: #3d92d1;
    --ka-dim: #1f4460;
    --gold: #e0a83e;
    --wood: #4a352a;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; min-height:100vh;
    background: radial-gradient(circle at 50% -10%, #2a2432 0%, var(--bg-deep) 65%);
    color: var(--cream);
    font-family: 'Noto Sans JP', sans-serif;
    display:flex; align-items:center; justify-content:center;
  }
  .app{
    width: 100%;
    max-width: 480px;
    padding: 32px 24px 40px;
  }
  .eyebrow{
    font-family:'Zen Maru Gothic', sans-serif;
    font-size: 13px;
    letter-spacing: 0.3em;
    color: var(--gold);
    text-align:center;
    margin-bottom: 4px;
  }
  h1{
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight: 900;
    font-size: 28px;
    text-align:center;
    margin: 0 0 28px;
    color: var(--cream);
    letter-spacing: 0.04em;
  }

  /* --- Drum face --- */
  .drum-wrap{
    position:relative;
    width: 260px; height: 260px;
    margin: 0 auto 20px;
  }
  .drum{
    width:100%; height:100%;
    border-radius:50%;
    background:
      radial-gradient(circle at 50% 42%, #2a2028 0%, #1a1418 55%, var(--wood) 100%);
    border: 10px solid var(--wood);
    box-shadow:
      0 0 0 4px #2a1e17,
      inset 0 0 40px rgba(0,0,0,0.6),
      0 12px 32px rgba(0,0,0,0.5);
    position:relative;
    display:flex; align-items:center; justify-content:center;
    transition: transform 0.06s ease-out;
  }
  .drum.hit{ transform: scale(0.965); }
  .drum-face{
    width: 72%; height:72%;
    border-radius:50%;
    background: radial-gradient(circle at 45% 40%, #3a3038, #211a20 70%);
    display:flex; align-items:center; justify-content:center;
    position:relative;
    overflow:hidden;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.7);
  }
  .drum-face::before,
  .drum-face::after{
    content:"";
    position:absolute;
    top:0; bottom:0; width:50%;
    opacity:0;
    transition: opacity 0.06s ease-out;
  }
  .drum-face::before{ left:0; background: radial-gradient(circle at 30% 50%, var(--don), transparent 70%); }
  .drum-face::after{ right:0; background: radial-gradient(circle at 70% 50%, var(--ka), transparent 70%); }
  .drum-face.flash-don::before{ opacity:0.9; }
  .drum-face.flash-ka::after{ opacity:0.9; }
  .drum-face.flash-accent::before,
  .drum-face.flash-accent::after{ opacity:1; }

  .bpm-readout{
    position:relative;
    text-align:center;
    margin-bottom: 6px;
  }
  .bpm-num{
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:900;
    font-size: 64px;
    line-height:1;
    color: var(--cream);
    font-variant-numeric: tabular-nums;
  }
  .bpm-unit{
    font-size: 14px;
    color: var(--cream-dim);
    letter-spacing: 0.15em;
  }

  .slider-row{
    display:flex; align-items:center; gap:12px;
    margin: 18px 0 8px;
  }
  input[type=range]{
    -webkit-appearance:none; appearance:none;
    flex:1;
    height: 6px;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--don-dim), var(--wood));
    outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width: 22px; height:22px;
    border-radius:50%;
    background: var(--gold);
    border: 3px solid var(--bg-deep);
    cursor:pointer;
    box-shadow: 0 0 0 2px var(--gold);
  }
  input[type=range]::-moz-range-thumb{
    width: 22px; height:22px;
    border-radius:50%;
    background: var(--gold);
    border: 3px solid var(--bg-deep);
    cursor:pointer;
  }
  .bpm-btn{
    width: 34px; height:34px;
    border-radius: 8px;
    border: 1px solid #4a4350;
    background: #26212b;
    color: var(--cream);
    font-size: 18px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    user-select:none;
    transition: background 0.15s;
  }
  .bpm-btn:hover{ background:#332c3a; }
  .bpm-btn:active{ background: var(--don-dim); }

  .bpm-input-row{
    display:flex; justify-content:center; align-items:center; gap:8px;
    margin-bottom: 22px;
  }
  .bpm-input-row input[type=number]{
    width: 84px;
    text-align:center;
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size: 16px;
    background:#26212b;
    border:1px solid #4a4350;
    color: var(--cream);
    border-radius: 8px;
    padding: 6px 4px;
  }
  .bpm-input-row span{ color:var(--cream-dim); font-size:13px; }

  .section-label{
    font-size: 12px;
    letter-spacing: 0.2em;
    color: var(--cream-dim);
    margin: 18px 0 8px;
    text-align:center;
  }

  .tabs{
    display:flex;
    gap: 8px;
    background: #211c26;
    padding: 5px;
    border-radius: 12px;
    margin-bottom: 18px;
  }
  .tab{
    flex:1;
    text-align:center;
    padding: 10px 4px;
    border-radius: 8px;
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size: 14px;
    color: var(--cream-dim);
    cursor:pointer;
    transition: all 0.15s;
  }
  .tab .sub{ display:block; font-size:10px; font-weight:400; opacity:0.7; margin-top:2px; }
  .tab.active{
    background: linear-gradient(180deg, var(--don), #a4302b);
    color: #fff;
    box-shadow: 0 2px 8px rgba(224,69,63,0.4);
  }

  .beats-row{
    display:flex; justify-content:center; gap:10px;
    margin-bottom: 26px;
    flex-wrap:wrap;
  }
  .beat-chip{
    width:40px; height:40px;
    border-radius:50%;
    background:#26212b;
    border: 1px solid #4a4350;
    display:flex; align-items:center; justify-content:center;
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    color: var(--cream-dim);
    cursor:pointer;
    transition: all 0.15s;
  }
  .beat-chip.active{
    background: linear-gradient(180deg, var(--ka), #205f8a);
    color:#fff;
    border-color: var(--ka);
  }

  .play-btn{
    display:block;
    width: 100%;
    padding: 18px;
    border-radius: 16px;
    border: none;
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:900;
    font-size: 20px;
    letter-spacing: 0.08em;
    color: #fff;
    background: linear-gradient(180deg, #e0453f, #a4302b);
    box-shadow: 0 6px 0 #7a2320, 0 10px 20px rgba(224,69,63,0.3);
    cursor:pointer;
    transition: transform 0.08s, box-shadow 0.08s;
  }
  .play-btn:active{
    transform: translateY(4px);
    box-shadow: 0 2px 0 #7a2320, 0 4px 10px rgba(224,69,63,0.3);
  }
  .play-btn.playing{
    background: linear-gradient(180deg, #3d92d1, #205f8a);
    box-shadow: 0 6px 0 #163f5c, 0 10px 20px rgba(61,146,209,0.3);
  }
  .play-btn.playing:active{
    box-shadow: 0 2px 0 #163f5c, 0 4px 10px rgba(61,146,209,0.3);
  }

  .legend{
    display:flex; justify-content:center; gap:20px;
    margin-top:16px;
    font-size:12px;
    color: var(--cream-dim);
  }
  .legend span{ display:inline-flex; align-items:center; gap:6px; }
  .dot{ width:10px; height:10px; border-radius:50%; display:inline-block; }
  .dot.don{ background: var(--don); }
  .dot.ka{ background: var(--ka); }

  /* --- Timer --- */
  .timer-box{
    margin-top: 28px;
    padding: 16px;
    border-radius: 14px;
    background: #211c26;
    border: 1px solid #34303c;
    text-align:center;
  }
  .timer-display{
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:900;
    font-size: 36px;
    color: var(--gold);
    font-variant-numeric: tabular-nums;
    margin: 6px 0 10px;
  }
  .timer-controls{
    display:flex; justify-content:center; align-items:center; gap:8px;
    font-size:13px;
    color: var(--cream-dim);
  }
  .timer-controls input[type=number]{
    width: 64px;
    text-align:center;
    background:#26212b;
    border:1px solid #4a4350;
    color: var(--cream);
    border-radius: 8px;
    padding: 5px 4px;
    font-size:14px;
  }
  .timer-note{
    font-size:11px;
    color: var(--cream-dim);
    margin-top:6px;
    opacity:0.75;
  }

  /* --- Mic rhythm check --- */
  .mic-box{
    margin-top: 18px;
    padding: 18px;
    border-radius: 14px;
    background: #211c26;
    border: 1px solid #34303c;
  }
  .mic-btn{
    display:block;
    width:100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--ka);
    background: transparent;
    color: var(--ka);
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size: 15px;
    cursor:pointer;
    transition: all 0.15s;
  }
  .mic-btn.on{
    background: linear-gradient(180deg, var(--ka), #205f8a);
    color:#fff;
  }
  .mic-status{
    text-align:center;
    font-size:12px;
    color: var(--cream-dim);
    margin: 10px 0 6px;
    min-height: 16px;
  }
  .meter-track{
    position:relative;
    height: 14px;
    border-radius: 8px;
    background: linear-gradient(90deg, #6e2624 0%, #3a3038 20%, var(--gold) 50%, #3a3038 80%, #1f4460 100%);
    margin: 10px 4px 4px;
    overflow:visible;
  }
  .meter-needle{
    position:absolute;
    top:-4px;
    left:50%;
    width: 4px; height: 22px;
    border-radius:2px;
    background: #fff;
    box-shadow: 0 0 6px rgba(255,255,255,0.8);
    transform: translateX(-50%);
    transition: left 0.08s ease-out, opacity 0.2s;
    opacity:0;
  }
  .meter-labels{
    display:flex; justify-content:space-between;
    font-size:10px;
    color: var(--cream-dim);
    padding: 0 2px;
    letter-spacing:0.05em;
  }
  .mic-last{
    text-align:center;
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size: 18px;
    margin: 14px 0 6px;
    min-height: 24px;
  }
  .mic-last.good{ color:#5fd97a; }
  .mic-last.ok{ color: var(--gold); }
  .mic-last.bad{ color: var(--don); }
  .mic-stats{
    text-align:center;
    font-size:12px;
    color: var(--cream-dim);
    margin-bottom: 12px;
    line-height:1.6;
  }
  .mic-reset-btn{
    display:block;
    margin: 0 auto;
    background:none;
    border:none;
    color: var(--cream-dim);
    font-size:12px;
    text-decoration: underline;
    cursor:pointer;
  }
</style>
</head>
<body>
<div class="app">
  <div class="eyebrow">TAIKO PRACTICE TOOL</div>
  <h1>太鼓メトロノーム</h1>

  <div class="drum-wrap">
    <div class="drum" id="drum">
      <div class="drum-face" id="drumFace"></div>
    </div>
  </div>

  <div class="bpm-readout">
    <span class="bpm-num" id="bpmNum">120</span>
    <span class="bpm-unit">BPM</span>
  </div>

  <div class="slider-row">
    <div class="bpm-btn" id="bpmDown">−</div>
    <input type="range" id="bpmSlider" min="30" max="300" value="120" step="1">
    <div class="bpm-btn" id="bpmUp">＋</div>
  </div>
  <div class="bpm-input-row">
    <span>直接入力:</span>
    <input type="number" id="bpmInput" min="30" max="300" value="120">
  </div>

  <div class="section-label">音符 (SUBDIVISION)</div>
  <div class="tabs" id="subTabs">
    <div class="tab" data-sub="1">4分<span class="sub">♩</span></div>
    <div class="tab" data-sub="2">8分<span class="sub">♫</span></div>
    <div class="tab active" data-sub="4">16分<span class="sub">♬</span></div>
  </div>

  <div class="section-label">拍子 (BEATS PER MEASURE)</div>
  <div class="beats-row" id="beatsRow">
    <div class="beat-chip" data-beats="2">2</div>
    <div class="beat-chip" data-beats="3">3</div>
    <div class="beat-chip active" data-beats="4">4</div>
    <div class="beat-chip" data-beats="6">6</div>
  </div>

  <button class="play-btn" id="playBtn">再生する</button>

  <div class="legend">
    <span><span class="dot don"></span>ドン(拍アクセント)</span>
    <span><span class="dot ka"></span>カッ(裏拍)</span>
  </div>

  <div class="timer-box">
    <div class="section-label" style="margin-top:0;">練習タイマー</div>
    <div class="timer-display" id="timerDisplay">00:00</div>
    <div class="timer-controls">
      <span>目標時間:</span>
      <input type="number" id="timerTarget" min="0" placeholder="任意">
      <span>分で自動停止</span>
    </div>
  </div>

  <div class="mic-box">
    <div class="section-label" style="margin-top:0;">マイクでリズムチェック(実験的機能)</div>
    <button class="mic-btn" id="micBtn">マイクを有効にする</button>
    <div class="mic-status" id="micStatus">オフ(メトロノームを再生してから叩いてください)</div>

    <div class="meter-track">
      <div class="meter-needle" id="meterNeedle"></div>
    </div>
    <div class="meter-labels"><span>早い</span><span>ぴったり</span><span>遅い</span></div>

    <div class="mic-last" id="micLast">&nbsp;</div>
    <div class="mic-stats" id="micStats">まだ記録がありません</div>
    <button class="mic-reset-btn" id="micReset">記録をリセット</button>
    <div class="timer-note">※ ブラウザ/環境によってはマイクが使えないことがあります。うまく動かない場合は、このファイルをダウンロードして通常のブラウザタブで開いてみてください。</div>
  </div>
</div>

<script>
(function(){
  let audioCtx = null;
  let isPlaying = false;
  let bpm = 120;
  let subdivision = 4; // 1=quarter, 2=eighth, 4=sixteenth
  let beatsPerMeasure = 4;

  let currentStep = 0;      // which 16th-subdivision step within measure
  let nextNoteTime = 0.0;
  let schedulerTimer = null;
  const lookahead = 25.0;      // ms
  const scheduleAheadTime = 0.1; // sec

  const bpmNum = document.getElementById('bpmNum');
  const bpmSlider = document.getElementById('bpmSlider');
  const bpmInput = document.getElementById('bpmInput');
  const bpmDown = document.getElementById('bpmDown');
  const bpmUp = document.getElementById('bpmUp');
  const playBtn = document.getElementById('playBtn');
  const drum = document.getElementById('drum');
  const drumFace = document.getElementById('drumFace');
  const subTabs = document.getElementById('subTabs');
  const beatsRow = document.getElementById('beatsRow');

  const timerDisplay = document.getElementById('timerDisplay');
  const timerTarget = document.getElementById('timerTarget');
  let timerInterval = null;
  let timerStart = 0;

  const micBtn = document.getElementById('micBtn');
  const micStatus = document.getElementById('micStatus');
  const meterNeedle = document.getElementById('meterNeedle');
  const micLast = document.getElementById('micLast');
  const micStats = document.getElementById('micStats');
  const micReset = document.getElementById('micReset');

  let micEnabled = false;
  let micStream = null;
  let micAnalyser = null;
  let micDataArray = null;
  let micRafId = null;
  let bgLevel = 0.02;      // adaptive background noise level (EMA)
  let lastHitTime = -1;
  const REFRACTORY = 0.12; // seconds between accepted onsets
  const MATCH_WINDOW = 0.15; // seconds, max distance to count as a judged hit

  let expectedTimes = []; // {time, kind}
  let hitStats = { good: 0, ok: 0, bad: 0, sumAbsMs: 0, count: 0 };

  function setBpm(v){
    v = Math.max(30, Math.min(300, Math.round(v)));
    bpm = v;
    bpmNum.textContent = v;
    bpmSlider.value = v;
    bpmInput.value = v;
  }

  bpmSlider.addEventListener('input', e => setBpm(e.target.value));
  bpmInput.addEventListener('change', e => setBpm(e.target.value));
  bpmDown.addEventListener('click', () => setBpm(bpm - 1));
  bpmUp.addEventListener('click', () => setBpm(bpm + 1));

  subTabs.addEventListener('click', e => {
    const tab = e.target.closest('.tab');
    if(!tab) return;
    [...subTabs.children].forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    subdivision = parseInt(tab.dataset.sub, 10);
    currentStep = 0;
  });

  beatsRow.addEventListener('click', e => {
    const chip = e.target.closest('.beat-chip');
    if(!chip) return;
    [...beatsRow.children].forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    beatsPerMeasure = parseInt(chip.dataset.beats, 10);
    currentStep = 0;
  });

  // --- sound synthesis: standard metronome click ---
  let noiseBuffer = null;
  function getNoiseBuffer(ctx){
    if(noiseBuffer) return noiseBuffer;
    const len = ctx.sampleRate * 0.05;
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for(let i=0;i<len;i++) data[i] = Math.random()*2-1;
    noiseBuffer = buf;
    return buf;
  }

  function playMetroClick(time, kind){
    const ctx = audioCtx;
    let freq, peak, dur;
    if(kind === 'accent'){ freq = 1500; peak = 0.85; dur = 0.045; }
    else if(kind === 'beat'){ freq = 1000; peak = 0.55; dur = 0.04; }
    else { freq = 1000; peak = 0.22; dur = 0.03; }

    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, time);
    const oscGain = ctx.createGain();
    oscGain.gain.setValueAtTime(0.0001, time);
    oscGain.gain.exponentialRampToValueAtTime(peak, time + 0.001);
    oscGain.gain.exponentialRampToValueAtTime(0.0001, time + dur);
    osc.connect(oscGain);
    oscGain.connect(ctx.destination);
    osc.start(time);
    osc.stop(time + dur + 0.01);

    // tiny noise transient for a crisp "tick" attack
    const noise = ctx.createBufferSource();
    noise.buffer = getNoiseBuffer(ctx);
    const noiseFilter = ctx.createBiquadFilter();
    noiseFilter.type = 'highpass';
    noiseFilter.frequency.value = 2500;
    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.0001, time);
    noiseGain.gain.exponentialRampToValueAtTime(peak * 0.4, time + 0.001);
    noiseGain.gain.exponentialRampToValueAtTime(0.0001, time + 0.012);
    noise.connect(noiseFilter);
    noiseFilter.connect(noiseGain);
    noiseGain.connect(ctx.destination);
    noise.start(time);
    noise.stop(time + 0.02);
  }

  function playClick(time, kind){
    // kind: 'accent' (measure downbeat), 'beat' (main beat, non-first), 'sub' (subdivision offbeat)
    playMetroClick(time, kind);

    // schedule visual flash aligned with audio time
    const delayMs = Math.max(0, (time - audioCtx.currentTime) * 1000);
    setTimeout(() => flashVisual(kind), delayMs);
  }

  function flashVisual(kind){
    drum.classList.add('hit');
    drumFace.classList.remove('flash-don','flash-ka','flash-accent');
    if(kind === 'accent') drumFace.classList.add('flash-accent');
    else if(kind === 'beat') drumFace.classList.add('flash-don');
    else drumFace.classList.add('flash-ka');

    setTimeout(() => {
      drum.classList.remove('hit');
      drumFace.classList.remove('flash-don','flash-ka','flash-accent');
    }, 90);
  }

  function secondsPerSubStep(){
    // one quarter note = 60/bpm seconds. subdivision divides the quarter note.
    return (60.0 / bpm) / subdivision;
  }

  function totalStepsPerMeasure(){
    return beatsPerMeasure * subdivision;
  }

  function scheduleNote(stepIndex, time){
    const isMeasureStart = (stepIndex === 0);
    const isMainBeat = (stepIndex % subdivision === 0);
    let kind;
    if(isMeasureStart) kind = 'accent';
    else if(isMainBeat) kind = 'beat';
    else kind = 'sub';
    playClick(time, kind);
    expectedTimes.push({ time, kind });
  }

  function pruneExpectedTimes(now){
    // keep a small rolling window around "now" for matching mic onsets
    while(expectedTimes.length && expectedTimes[0].time < now - 2.0){
      expectedTimes.shift();
    }
  }

  function scheduler(){
    while(nextNoteTime < audioCtx.currentTime + scheduleAheadTime){
      scheduleNote(currentStep, nextNoteTime);
      nextNoteTime += secondsPerSubStep();
      currentStep = (currentStep + 1) % totalStepsPerMeasure();
    }
    schedulerTimer = setTimeout(scheduler, lookahead);
  }

  // --- practice timer ---
  function formatTime(ms){
    const totalSec = Math.floor(ms / 1000);
    const m = Math.floor(totalSec / 60);
    const s = totalSec % 60;
    return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  }

  function tickTimer(){
    const elapsed = Date.now() - timerStart;
    timerDisplay.textContent = formatTime(elapsed);
    const targetMin = parseFloat(timerTarget.value);
    if(targetMin > 0 && elapsed >= targetMin * 60000){
      stop();
      micStatus.textContent = '設定した練習時間になったので停止しました。お疲れさまでした!';
    }
  }

  function startTimer(){
    timerStart = Date.now();
    timerDisplay.textContent = '00:00';
    clearInterval(timerInterval);
    timerInterval = setInterval(tickTimer, 250);
  }

  function stopTimer(){
    clearInterval(timerInterval);
    timerInterval = null;
  }

  // --- mic-based rhythm check ---
  async function enableMic(){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      micStatus.textContent = 'この環境ではマイクを利用できません。ファイルをダウンロードして通常のブラウザで開いてください。';
      return;
    }
    try{
      micStatus.textContent = 'マイクへのアクセスを許可してください…';
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation:false, noiseSuppression:false, autoGainControl:false }
      });
      if(!audioCtx){
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if(audioCtx.state === 'suspended') await audioCtx.resume();

      const source = audioCtx.createMediaStreamSource(micStream);
      micAnalyser = audioCtx.createAnalyser();
      micAnalyser.fftSize = 1024;
      micDataArray = new Float32Array(micAnalyser.fftSize);
      source.connect(micAnalyser);
      // NOTE: analyser is not connected to destination, so no feedback/echo.

      micEnabled = true;
      bgLevel = 0.02;
      micBtn.textContent = 'マイクを無効にする';
      micBtn.classList.add('on');
      micStatus.textContent = isPlaying ? 'リスニング中… 太鼓を叩いてみましょう' : 'リスニング中… (メトロノームを再生すると判定されます)';
      monitorMic();
    }catch(err){
      micEnabled = false;
      micStatus.textContent = 'マイクにアクセスできませんでした。ブラウザの権限設定を確認するか、このファイルをダウンロードして通常のブラウザタブで開いてみてください。';
    }
  }

  function disableMic(){
    micEnabled = false;
    if(micRafId) cancelAnimationFrame(micRafId);
    micRafId = null;
    if(micStream){
      micStream.getTracks().forEach(t => t.stop());
      micStream = null;
    }
    micAnalyser = null;
    micBtn.textContent = 'マイクを有効にする';
    micBtn.classList.remove('on');
    micStatus.textContent = 'オフ(メトロノームを再生してから叩いてください)';
    meterNeedle.style.opacity = 0;
  }

  function monitorMic(){
    if(!micEnabled) return;
    micAnalyser.getFloatTimeDomainData(micDataArray);
    let sumSq = 0;
    for(let i=0;i<micDataArray.length;i++){ sumSq += micDataArray[i]*micDataArray[i]; }
    const rms = Math.sqrt(sumSq / micDataArray.length);

    const now = audioCtx.currentTime;
    pruneExpectedTimes(now);

    const isOnset = rms > Math.max(0.06, bgLevel * 3.2) && (now - lastHitTime) > REFRACTORY;

    if(isOnset){
      lastHitTime = now;
      judgeHit(now);
    } else {
      // slowly adapt background level toward current quiet level
      bgLevel = bgLevel * 0.97 + rms * 0.03;
    }

    micRafId = requestAnimationFrame(monitorMic);
  }

  function judgeHit(hitTime){
    if(!isPlaying || expectedTimes.length === 0){
      micLast.textContent = '(メトロノームを再生してください)';
      micLast.className = 'mic-last';
      return;
    }
    let closest = null, closestDist = Infinity;
    for(const e of expectedTimes){
      const d = Math.abs(e.time - hitTime);
      if(d < closestDist){ closestDist = d; closest = e; }
    }
    if(!closest || closestDist > MATCH_WINDOW){
      micLast.textContent = '拍から外れています';
      micLast.className = 'mic-last bad';
      meterNeedle.style.opacity = 0;
      return;
    }
    const deltaMs = Math.round((hitTime - closest.time) * 1000);
    const absMs = Math.abs(deltaMs);

    let label, cls;
    if(absMs <= 25){ label = '良! ' ; cls = 'good'; hitStats.good++; }
    else if(absMs <= 60){ label = '可 '; cls = 'ok'; hitStats.ok++; }
    else { label = '不可 '; cls = 'bad'; hitStats.bad++; }

    const dirText = deltaMs === 0 ? 'ジャスト' : (deltaMs > 0 ? `${absMs}ms 遅い` : `${absMs}ms 早い`);
    micLast.textContent = label + dirText;
    micLast.className = 'mic-last ' + cls;

    hitStats.count++;
    hitStats.sumAbsMs += absMs;
    const avg = Math.round(hitStats.sumAbsMs / hitStats.count);
    micStats.textContent = `判定回数: ${hitStats.count}  良:${hitStats.good} 可:${hitStats.ok} 不可:${hitStats.bad}  平均ズレ:${avg}ms`;

    // move needle: clamp delta to +-150ms across the track width
    const pct = 50 + Math.max(-1, Math.min(1, deltaMs / 150)) * 48;
    meterNeedle.style.left = pct + '%';
    meterNeedle.style.opacity = 1;
  }

  micBtn.addEventListener('click', () => {
    if(micEnabled) disableMic(); else enableMic();
  });

  micReset.addEventListener('click', () => {
    hitStats = { good:0, ok:0, bad:0, sumAbsMs:0, count:0 };
    micStats.textContent = 'まだ記録がありません';
    micLast.textContent = '\u00a0';
    micLast.className = 'mic-last';
    meterNeedle.style.opacity = 0;
  });

  function start(){
    if(isPlaying) return;
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
    isPlaying = true;
    currentStep = 0;
    expectedTimes = [];
    nextNoteTime = audioCtx.currentTime + 0.05;
    scheduler();
    playBtn.textContent = '停止する';
    playBtn.classList.add('playing');
    startTimer();
    if(micEnabled){
      micStatus.textContent = 'リスニング中… 太鼓を叩いてみましょう';
    }
  }

  function stop(){
    isPlaying = false;
    clearTimeout(schedulerTimer);
    playBtn.textContent = '再生する';
    playBtn.classList.remove('playing');
    stopTimer();
    if(micEnabled){
      micStatus.textContent = 'リスニング中… (メトロノームを再生すると判定されます)';
    }
  }

  playBtn.addEventListener('click', () => {
    if(isPlaying) stop(); else start();
  });

  // keyboard: space to toggle
  document.addEventListener('keydown', e => {
    if(e.code === 'Space' && e.target.tagName !== 'INPUT'){
      e.preventDefault();
      if(isPlaying) stop(); else start();
    }
  });

  setBpm(120);
})();
</script>
</body>
</html>
